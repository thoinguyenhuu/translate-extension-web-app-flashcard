<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vocabulary Learning</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .auth-gate {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 280px; text-align: center; padding: 24px;
    }
    .auth-gate-title { margin: 0 0 8px; font-size: 20px; }
    .auth-gate-sub { color: #5b6473; font-size: 13px; margin: 0 0 6px; }
    .auth-gate-hint { color: #94a3b8; font-size: 12px; margin: 0 0 20px; }
    .auth-gate-btn {
      padding: 10px 20px; border: none; border-radius: 10px;
      background: #0f62fe; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .auth-gate-btn:hover { opacity: 0.9; }

    .popup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .settings-btn {
      background: none; border: none; cursor: pointer; padding: 4px;
      color: #64748b; font-size: 18px; line-height: 1;
    }
    .settings-btn:hover { color: #1f2937; }

    .popup-content { display: none; }
    .popup-content.is-authenticated { display: block; }
  </style>
</head>
<body>
  <main class="popup">
    <!-- Auth gate -->
    <section id="authGate" class="auth-gate">
      <h2 class="auth-gate-title">Vocabulary Learning</h2>
      <p class="auth-gate-sub">Sign in to save and review vocabulary</p>
      <p class="auth-gate-hint">Login on the web app, then come back here</p>
      <button id="loginBtn" class="auth-gate-btn" type="button">Open Web App to Login</button>
    </section>

    <!-- Main content -->
    <div id="popupContent" class="popup-content">
      <div class="popup-header">
        <h1 class="title" style="margin:0;">Vocabulary</h1>
        <button id="settingsBtn" class="settings-btn" type="button" title="Settings">&#9881;</button>
      </div>

      <!-- Word input -->
      <div class="word-input-row">
        <input id="wordInput" class="text-input word-input" type="text" placeholder="Enter a word" autocomplete="off" />
        <button id="translateButton" class="button button-secondary" type="button">Translate</button>
      </div>

      <!-- Result card (shown after translate) -->
      <section id="resultCard" class="result-card-main" style="display:none">
        <div class="card-word-row">
          <span id="cardWord" class="card-word-big"></span>
          <span id="cardPos" class="pos-badge"></span>
        </div>

        <div class="meaning-group">
          <label class="meaning-label">Main meaning</label>
          <input id="mainMeaningInput" class="text-input" type="text" placeholder="Main meaning" />
        </div>

        <div class="meaning-group">
          <label class="meaning-label">Other meanings</label>
          <ul id="meaningsList" class="meanings-editable"></ul>
          <button id="addMeaningBtn" class="add-meaning-btn" type="button">+ Add meaning</button>
        </div>

        <button id="saveButton" class="button button-primary save-btn-main" type="button">
          Save to vocabulary
        </button>
      </section>

      <!-- Last saved -->
      <section class="result-card" id="lastSavedSection">
        <p class="result-label">Last saved</p>
        <p id="resultWord" class="result-word">No word saved yet</p>
        <p id="resultMeaning" class="result-meaning">Use Translate then Save to build your vocabulary.</p>
        <div class="other-meanings">
          <p class="other-meanings-label">Other meanings</p>
          <ul id="resultMeaningList" class="meaning-list">
            <li>No saved definition yet.</li>
          </ul>
        </div>
        <p id="resultMeta" class="result-meta"></p>
      </section>

      <p id="statusMessage" class="status" aria-live="polite"></p>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
